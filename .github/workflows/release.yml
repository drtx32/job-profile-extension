name: Release extension (CD)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match manifest version $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: npm ci --prefix tests

      - name: Run existing checks
        run: node tests/run.js

      - name: Package browser extension
        shell: bash
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          PACKAGE_DIR="dist/job-profile-extension"
          mkdir -p "$PACKAGE_DIR"
          cp manifest.json background.js content.js agent-bridge.js styles.css xlsx.full.min.js README.md "$PACKAGE_DIR/"
          cp -R lib icons "$PACKAGE_DIR/"
          cd dist
          zip -qr "job-profile-extension-v${{ steps.version.outputs.value }}.zip" job-profile-extension
          if [[ -z "$CRX_PRIVATE_KEY" ]]; then
            echo "Repository secret CRX_PRIVATE_KEY is required to produce a stable, signed CRX." >&2
            exit 1
          fi
          printf '%s\n' "$CRX_PRIVATE_KEY" > crx-private-key.pem
          npm install --global crx3@2.0.0
          crx3 --key crx-private-key.pem --crx "job-profile-extension-v${{ steps.version.outputs.value }}.crx" job-profile-extension
          rm -f crx-private-key.pem

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Job Profile Extension v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/job-profile-extension-v${{ steps.version.outputs.value }}.zip
            dist/job-profile-extension-v${{ steps.version.outputs.value }}.crx
